openapi: 3.0.3
info:
  title: Schedula API
  version: 1.0.0
  description: OpenAPI spec generato dal codice server (Flask). Alcuni endpoint sono
    condizionati da feature-flag di configurazione.
servers:
- url: /
tags:
- name: OpenAPI
- name: Security
- name: Groups
- name: Casbin
- name: Items
- name: Item ACL
- name: Item Files
- name: Item Schemas
- name: Export
- name: Stripe
- name: GDPR
- name: Contact
- name: Locales
- name: Files
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
    authToken:
      type: apiKey
      in: header
      name: Authentication-Token
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    Status:
      type: object
      properties:
        status:
          type: string
    Item:
      type: object
      properties:
        id:
          type: string
        category:
          type: string
        acl_dom:
          type: string
        grants_ref:
          type: string
          nullable: true
        created_by:
          type: string
        updated_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
        files:
          type: object
          additionalProperties: true
    ItemCreate:
      type: object
      properties:
        acl_dom:
          type: string
          description: Dominio ACL esplicito (workspace).
        group_id:
          type: string
          description: Se presente, acl_dom viene derivato dal gruppo (acl_group).
        data:
          type: object
          additionalProperties: true
    ItemUpdate:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
    ItemListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        next_offset:
          type: integer
          nullable: true
    ShareEntry:
      type: object
      required:
      - target
      - actions
      properties:
        target:
          type: string
          description: 'Principal target, es: u:2, g:123, g:123:admin'
        actions:
          type: array
          items:
            type: string
            enum:
            - read
            - write
            - manage
    ShareReplacePayload:
      type: object
      required:
      - entries
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ShareEntry'
    ShareListResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ShareEntry'
    ItemSchemaDoc:
      type: object
      properties:
        category:
          type: string
        version:
          type: string
          description: SemVer string (x.y.z)
        status:
          type: string
          enum:
          - draft
          - published
        is_enabled:
          type: boolean
        is_placeholder:
          type: boolean
        note:
          type: string
          nullable: true
        schema:
          type: object
          additionalProperties: true
          description: Mongo $jsonSchema fragment for the item data field
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
    ItemSchemaCategory:
      type: object
      properties:
        category:
          type: string
        max_version:
          type: string
        published_enabled_versions:
          type: array
          items:
            type: string
    ItemSchemaCategoryListResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ItemSchemaCategory'
    ItemSchemaCategoryDetailResponse:
      type: object
      properties:
        category:
          type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/ItemSchemaDoc'
    ItemSchemaDraftCreate:
      type: object
      required:
      - version
      - schema
      properties:
        version:
          type: string
          description: SemVer string (x.y.z)
        schema:
          type: object
          additionalProperties: true
        note:
          type: string
          nullable: true
    ItemSchemaDraftUpdate:
      type: object
      properties:
        schema:
          type: object
          additionalProperties: true
        note:
          type: string
          nullable: true
    ItemSchemaStatusResponse:
      type: object
      properties:
        ok:
          type: boolean
        category:
          type: string
        version:
          type: string
        status:
          type: string
        is_enabled:
          type: boolean
